services:
  wordpress:
    image: wordpress:6.6.1-php8.2-apache
    container_name: wordpress_container
    restart: always
    environment:
      WORDPRESS_DB_HOST: mysql_container:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: C0del@b08
      WORDPRESS_DB_NAME: wordpress_dev
      WORDPRESS_DEBUG: 1
    volumes:
      - ./wp-content:/var/www/html/wp-content
    ports:
      - '8081:80'
    networks:
      - mysql_admin_net

networks:
  mysql_admin_net:
    external: true
    name: mysql-phpmyadmin_mysql-admin-net
