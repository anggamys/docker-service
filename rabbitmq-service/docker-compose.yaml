services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-mqtt
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "0.0.0.0:1883:1883"
      - "127.0.0.1:15675:15675"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    entrypoint: >
      bash -lc "
      rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_tracing &&
      rabbitmq-server
      "
    networks:
      - local-network

volumes:
  rabbitmq_data:

networks:
  local-network:
    external: true
