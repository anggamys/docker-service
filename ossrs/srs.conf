listen              1935;
max_connections     2000;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
}

rtc_server {
    enabled         on;
    listen          10080;
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
    }
}
