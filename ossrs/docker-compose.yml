services:
  srs:
    image: ossrs/srs:6
    container_name: srs_server
    restart: unless-stopped
    ports:
      - "1935:1935" # RTMP input
      - "1985:1985" # API dashboard
      - "8080:8080" # HTTP/WebRTC page
      - "8000:8000/udp" # STUN/TURN WebRTC
      - "10080:10080/udp" # WebRTC data
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf
