services:
  postgres:
    image: postgres:15.6
    container_name: mlflow_postgres
    # restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:?set POSTGRES_EXPORTER_USER in .env}
      POSTGRES_EXPORTER_PASS: ${POSTGRES_EXPORTER_PASS:?set POSTGRES_EXPORTER_PASS in .env}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: mlflow_minio
    # restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
      TZ: Asia/Jakarta
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - ./data/storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    networks:
      local-network:
        aliases:
          - mlflow-minio
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mlflow_postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_EXPORTER_USER:?set POSTGRES_EXPORTER_USER in .env}:${POSTGRES_EXPORTER_PASS:?set POSTGRES_EXPORTER_PASS in .env}@postgres:5432/${POSTGRES_EXPORTER_DB:-postgres}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mlflow_create_bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/mlflow --ignore-existing;
      exit 0;
      "
    # restart: "no"
    networks:
      - local-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1-full
    container_name: mlflow_server
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

      # penting
      GUNICORN_CMD_ARGS: "--workers=1"

    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "${MLFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      --cors-allowed-origins "${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5000}"

    ports:
      - "${MLFLOW_BIND_ADDRESS:-127.0.0.1}:5000:5000"

    volumes:
      - ./data/mlflow:/mlflow

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

    mem_limit: 1g

    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
