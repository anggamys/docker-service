services:
  portainer:
    image: ${PORTAINER_IMAGE}
    container_name: ${PORTAINER_CONTAINER_NAME}
    restart: always
    ports:
      - "${PORTAINER_HTTPS_PORT}:9443"
      - "${PORTAINER_EDGE_PORT}:8000"
    volumes:
      - ${PORTAINER_DATA_VOLUME}:/data
      # Docker socket (full access)
      - /var/run/docker.sock:/var/run/docker.sock
      # Podman socket (rootless user 1000, sesuaikan UID jika berbeda)
      - /run/user/1000/podman/podman.sock:/var/run/podman/podman.sock
    environment:
      - TZ=${PORTAINER_TZ}
    security_opt:
      - no-new-privileges:true
      - label=disable # penting untuk akses socket Podman rootless

volumes:
  portainer_data:
    name: ${PORTAINER_DATA_VOLUME}
    external: true
