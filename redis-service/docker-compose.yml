services:
  redis:
    image: redis:7
    container_name: redis
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfilename appendonly.aof
      --dir /data
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - local-network

  redis-insight:
    image: redis/redisinsight:2.52.0
    container_name: redis_insight
    ports:
      - "5540:5540"
    volumes:
      - ./data/redisinsight:/db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - local-network

networks:
  local-network:
    external: true
