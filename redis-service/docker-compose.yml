services:
  redis:
    image: redis:7
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --save 60 1
      --appendonly yes
      --appendfilename appendonly.aof
      --dir /data
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  redis-insight:
    image: redis/redisinsight:2.52.0
    container_name: redis_insight
    ports:
      - "${REDIS_INSIGHT_BIND_ADDRESS:-127.0.0.1}:5540:5540"
    volumes:
      - ./data/redisinsight:/db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
