services:
  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: prometheus
    # restart: unless-stopped
    ports:
      - '${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:9090:9090'
    volumes:
      - ./config:/etc/prometheus:ro
      - ./secrets:/run/secrets:ro
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
      - '--log.level=warn'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    # restart: unless-stopped
    ports:
      - '${ALERTMANAGER_BIND_ADDRESS:-127.0.0.1}:9093:9093'
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    # restart: unless-stopped
    ports:
      - '${NODE_EXPORTER_BIND_ADDRESS:-127.0.0.1}:9100:9100'
    pid: 'host'
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    # restart: unless-stopped
    ports:
      - '${CADVISOR_BIND_ADDRESS:-127.0.0.1}:8081:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    # restart: unless-stopped
    user: "0:0"
    ports:
      - '${LOKI_BIND_ADDRESS:-127.0.0.1}:3100:3100'
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - ./data/loki:/loki
    command:
      - '-config.file=/etc/loki/loki.yml'
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    # restart: unless-stopped
    volumes:
      - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./data/promtail:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    depends_on:
      - loki
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    # restart: unless-stopped
    ports:
      - '${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
