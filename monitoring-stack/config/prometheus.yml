global:
  scrape_interval: 5s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "inference-service"
    static_configs:
      - targets: ["172.17.0.1:5001"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
