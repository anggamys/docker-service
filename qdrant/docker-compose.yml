services:
  qdrant:
    image: qdrant/qdrant:dev
    container_name: qdrant_service

    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC

    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      TZ: Asia/Jakarta

    volumes:
      - ./data/qdrant_storage:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - local-network

networks:
  local-network:
    external: true
