services:
  postgres:
    image: postgres:15.6
    container_name: postgres
    restart: ${RESTART_POLICY:-no}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:?set POSTGRES_EXPORTER_USER in .env}
      POSTGRES_EXPORTER_PASS: ${POSTGRES_EXPORTER_PASS:?set POSTGRES_EXPORTER_PASS in .env}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:9.0
    container_name: pgadmin
    restart: ${RESTART_POLICY:-no}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:8888:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: ${RESTART_POLICY:-no}
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_EXPORTER_USER:?set POSTGRES_EXPORTER_USER in .env}:${POSTGRES_EXPORTER_PASS:?set POSTGRES_EXPORTER_PASS in .env}@postgres:5432/${POSTGRES_EXPORTER_DB:-postgres}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
