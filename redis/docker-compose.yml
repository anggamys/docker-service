services:
  redis:
    image: redis:7
    container_name: redis
    restart: ${RESTART_POLICY:-no}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --save 60 1
      --appendonly yes
      --appendfilename appendonly.aof
      --dir /data
      --maxmemory ${REDIS_MAX_MEMORY:-128mb}
      --maxmemory-policy allkeys-lru
      --loglevel warning
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    # dev: 128m | prod: sesuai kebutuhan (256m, 512m, dst)
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  redis-insight:
    image: redis/redisinsight:2.52.0
    container_name: redis_insight
    restart: ${RESTART_POLICY:-no}
    ports:
      - "${REDIS_INSIGHT_BIND_ADDRESS:-127.0.0.1}:5540:5540"
    volumes:
      - ./data/redisinsight:/db
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis_exporter
    restart: ${RESTART_POLICY:-no}
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
