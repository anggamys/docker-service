services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped

    ports:
      - "127.0.0.1:20128:20128"

    volumes:
      - ${NINE_ROUTER_DATA_DIR:-~/.9router}:/app/data

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787

    depends_on:
      headroom:
        condition: service_started

    networks:
      - local-network

    security_opt:
      - no-new-privileges:true

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped

    networks:
      - local-network

    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
