services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: ${RESTART_POLICY:-no}
    ports:
      - "${RABBITMQ_AMQP_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${RABBITMQ_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:15672:15672"
      - "${RABBITMQ_MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
      - "${RABBITMQ_WEB_MQTT_BIND_ADDRESS:-127.0.0.1}:15675:15675"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    command: >
      sh -c "
      rabbitmq-plugins enable rabbitmq_management rabbitmq_mqtt rabbitmq_web_mqtt rabbitmq_prometheus &&
      rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # dev: 256m | prod: 512m+
    mem_limit: ${RABBITMQ_MEM_LIMIT:-256m}
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

volumes:
  rabbitmq_data:

networks:
  local-network:
    external: true
