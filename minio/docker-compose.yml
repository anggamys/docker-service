services:
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2025-12-20T04-58-37Z
    container_name: minio_service
    restart: ${RESTART_POLICY:-no}
    command: >
      minio server /mnt/data
      --console-address ":9001"
      --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - ./data/minio-data:/mnt/data
      - ./data/minio.license:/minio.license:ro
      - ./data/minio-certs:/etc/minio/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-network
    security_opt:
      - no-new-privileges:true

networks:
  local-network:
    external: true
